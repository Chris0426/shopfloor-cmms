# Edge proxy for the public demo (service `edge` in docker-compose.public.yml).
#
# Mounted as /etc/nginx/nginx.conf, so this is the whole config, not a conf.d snippet.
#
#   Caddy (host, TLS) -> 127.0.0.1:8000 -> edge (this, :80) -> app:8080
#
# Its only job is per-client rate limiting, which the host's Caddy (apt build, no
# rate-limit module) cannot do:
#   - every path except /health : 10 r/s per IP, burst 40, max 20 concurrent connections
#   - /app/login                : additionally 1 r/s per IP, burst 5
#   - over the limit            : HTTP 429
# The client IP is taken from X-Forwarded-For, trusted only from loopback and docker networks.

worker_processes auto;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Photo uploads on work orders.
    client_max_body_size 20m;

    # --- Real client IP -----------------------------------------------------------
    # Trusted hops: the host loopback (Caddy reaches us via the 127.0.0.1 port binding;
    # docker's proxy may present it as a bridge address) and the docker networks.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # $remote_addr is the real client IP after the realip module has run.
    log_format edge '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout edge;

    # --- Rate limits --------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Pass through the scheme Caddy set; default to https if it is missing.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }

    upstream cmms_app {
        server app:8080;
        keepalive 16;
    }

    # --- Proxy defaults (inherited by every location) -----------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    server {
        listen 80;
        server_name _;

        # Unlimited and unlogged: polled by the compose healthcheck and by Caddy.
        location = /health {
            access_log off;
            proxy_pass http://cmms_app;
        }

        # limit_req cannot be scoped to a method, so the login limit covers both the GET
        # (form) and the POST (sign-in). 1 r/s per IP with burst 5 is fine for humans.
        location = /app/login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=perip burst=40 nodelay;
            limit_conn conn 20;
            proxy_pass http://cmms_app;
        }

        # Everything else, including /static (served by the app itself; no caching here).
        location / {
            limit_req zone=perip burst=40 nodelay;
            limit_conn conn 20;
            proxy_pass http://cmms_app;
        }
    }
}
